spring.application.name=query-service
server.port=8081
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- LLM via Spring AI + Ollama (Day 2) --------------------------------------
# Ollama runs natively on Windows. Once: ollama pull llama3.2:3b
spring.ai.ollama.base-url=http://localhost:11434
# Spring AI 2.1 docs list chat.model; older samples use chat.options.model.
# Both are set so either works (unknown keys are ignored).
spring.ai.ollama.chat.model=llama3.2:3b
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.ollama.chat.options.temperature=0.2
# Don't download models at startup; pull them yourself with `ollama pull`
spring.ai.ollama.init.pull-model-strategy=never
