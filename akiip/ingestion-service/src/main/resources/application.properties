spring.application.name=ingestion-service
server.port=8082
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.probes.enabled=true

# --- Database (Day 3) -------------------------------------------------------
# Matches deploy/docker-compose/docker-compose.yml (host port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/akiip
spring.datasource.username=akiip
spring.datasource.password=akiip

# Flyway runs src/main/resources/db/migration/V*__*.sql on startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Flyway owns the schema: Hibernate must never create or alter tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
