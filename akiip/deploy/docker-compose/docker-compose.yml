# AKIIP local stack (Day 2)
# Start (from repo root):  docker compose -f deploy/docker-compose/docker-compose.yml up -d
# Status: docker compose -f deploy/docker-compose/docker-compose.yml ps
# Stop:   docker compose -f deploy/docker-compose/docker-compose.yml down        (add -v to also delete all data)
#
# Host ports are deliberately NOT the defaults (5433, 6380, 9010...) so they
# don't clash with other projects you may already run on this laptop.
# Ollama is NOT here: it runs natively on Windows (better performance) on port 11434.

name: akiip

services:

  postgres:
    image: pgvector/pgvector:pg17          # PostgreSQL 17 with the pgvector extension pre-installed
    container_name: akiip-postgres
    environment:
      POSTGRES_DB: akiip
      POSTGRES_USER: akiip
      POSTGRES_PASSWORD: akiip
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akiip -d akiip"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: akiip-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:                                # Kafka-compatible broker (single node, dev mode)
    image: redpandadata/redpanda:v26.2.6
    container_name: akiip-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"                      # Kafka bootstrap for apps on your laptop: localhost:19092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  object-store:                            # S3-compatible storage. MinIO stopped publishing free images, so we use RustFS.
    image: rustfs/rustfs:latest
    container_name: akiip-object-store
    environment:
      RUSTFS_ACCESS_KEY: akiip-dev
      RUSTFS_SECRET_KEY: akiip-dev-secret-change-me
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9010:9000"                        # S3 API      -> http://localhost:9010
      - "9011:9001"                        # Web console -> http://localhost:9011
    volumes:
      - object-store-data:/data

  keycloak:                                # Login / identity provider (dev mode, built-in H2 storage)
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: akiip-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"                        # Admin console -> http://localhost:8180

volumes:
  postgres-data:
  redpanda-data:
  object-store-data:
